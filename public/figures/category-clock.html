<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>What decided three categories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/synos.css">
<style>
/*
 * FIG. 12 · "What decided three categories"
 *
 * Four lanes on one shared time axis. Three carry a marker at the point an AI-native challenger
 * became the credible default in that category; the fourth carries no marker and its track runs
 * off the right edge of the axis, because the reader's own category has not turned over yet and
 * the axis has run out of room to show when it will.
 *
 * Two things must survive any later edit. The markers march rightward, so the eye reads an
 * acceleration rather than three unrelated facts. And the fourth lane is drawn in the same weight
 * as the other three, not greyed, because it is not hypothetical.
 *
 * No share percentages and no elapsed-month counts anywhere. Those would be invented numbers, and
 * the figure does not need them: the position of four marks on one axis is the whole argument.
 */

body { padding: 44px 32px; background: transparent; }
@media (max-width: 640px) { body { padding: 28px 18px; } }
.fig { max-width: 1080px; margin: 0 auto; }
.fig p { max-width: none; }

.fig-head { margin-bottom: var(--sk-space-7); }
.fig-num { display: block; font-family: var(--sk-font-mono); font-size: 11px;
  letter-spacing: 0.18em; color: var(--sk-dim); margin-bottom: var(--sk-space-4); }
.fig-title { font-family: var(--sk-font-body); font-size: clamp(22px, 2.4vw, 28px);
  font-weight: 600; letter-spacing: -0.02em; color: var(--sk-ink); }
.fig-lede { margin-top: var(--sk-space-4); font-size: 15px; line-height: 1.65;
  color: var(--sk-ink-3); max-width: 64ch !important; }

/* ── the plot ───────────────────────────────────────────────────────────── */
/* One grid, one geometry: the rail column and the track column line up across the axis and all
 * four lanes, so every mark is read against the same baseline. */
/* Third column is an empty gutter. It exists so the final year label, the "today" mark and the
 * arrow leaving the axis have somewhere to sit: at left:100% a centred label puts half its width
 * past the axis, and without the gutter that half is clipped by the figure's own edge. */
.plot { display: grid; grid-template-columns: 186px minmax(0, 1fr) 40px; }
@media (max-width: 720px) { .plot { grid-template-columns: 112px minmax(0, 1fr) 34px; } }

.axis { grid-column: 2; position: relative; height: 22px; }
.axis-gutter { grid-column: 3; }
.axis-line { position: absolute; left: 0; right: 0; bottom: 0; border-bottom: 1px solid var(--sk-ink); }
.yr { position: absolute; bottom: 5px; transform: translateX(-50%);
  font-family: var(--sk-font-mono); font-size: 10.5px; letter-spacing: 0.08em; color: var(--sk-muted); }
.yr::after { content: ''; position: absolute; left: 50%; bottom: -5px; width: 1px; height: 4px;
  background: var(--sk-border-2); }

.lane { display: contents; }
.lane-rail { grid-column: 1; padding: var(--sk-space-5) var(--sk-space-5) var(--sk-space-5) 0;
  border-bottom: 1px solid var(--sk-border); }
.lane-gutter { grid-column: 3; border-bottom: 1px solid var(--sk-border); }
.lane-n { font-size: 15px; font-weight: 600; letter-spacing: -0.012em; color: var(--sk-ink); line-height: 1.3; }
.lane-s { margin-top: 3px; font-family: var(--sk-font-mono); font-size: 10.5px;
  letter-spacing: 0.06em; color: var(--sk-muted); }
@media (max-width: 720px) { .lane-n { font-size: 13.5px; } .lane-s { font-size: 9.5px; } }

.lane-track { grid-column: 2; position: relative; min-height: 62px;
  border-bottom: 1px solid var(--sk-border); border-left: 1px solid var(--sk-border); }

/* the held stretch, before the category turned over */
.seg-before { position: absolute; top: 50%; transform: translateY(-50%); left: 0; height: 7px;
  background: var(--sk-border); border-radius: 1px; }
/* the stretch after, in the accent */
.seg-after { position: absolute; top: 50%; transform: translateY(-50%); right: 0; height: 7px;
  background: var(--sk-indigo-2); border-radius: 1px; }
.tick { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 2px; height: 26px;
  background: var(--sk-indigo-ink); border-radius: 1px; }
.tick-l { position: absolute; top: 50%; transform: translate(-50%, -50%);
  margin-top: -25px; white-space: nowrap; font-size: 12.5px; font-weight: 600;
  color: var(--sk-indigo-ink); letter-spacing: -0.01em; }
@media (max-width: 560px) { .tick-l { font-size: 11px; } }

/* the reader's own lane: same weight, no marker, and the track leaves the axis */
.seg-open { position: absolute; top: 50%; transform: translateY(-50%); left: 0; right: 0;
  height: 7px; border: 1px dashed var(--sk-border-2); border-radius: 1px; background: transparent; }
.now { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 2px; height: 26px;
  background: var(--sk-ink); }
.now-l { position: absolute; top: 50%; transform: translate(-50%, -50%); margin-top: -25px;
  white-space: nowrap; font-family: var(--sk-font-mono); font-size: 10.5px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--sk-ink-3); }
.spill { position: absolute; top: 50%; right: -34px; transform: translateY(-50%); }
@media (max-width: 720px) { .spill { right: -28px; } }

.fig-foot { margin-top: var(--sk-space-7); padding-top: var(--sk-space-5);
  border-top: 1px solid var(--sk-ink); font-size: 14px; line-height: 1.6; color: var(--sk-ink-2); }
.fig-foot b { font-weight: 600; color: var(--sk-ink); }
</style>
</head>
<body>

<figure class="fig">
  <div class="fig-head">
    <span class="fig-num">FIG. 12</span>
    <p class="fig-title">What decided three categories</p>
    <p class="fig-lede">Three categories where a company founded after 2021 became the answer people reach for first. None of them arrived with a better model than anyone else could obtain. Each built directly on the work being done, while the established platform was still moving its data somewhere new.</p>
  </div>

  <div class="plot">

    <div class="axis">
      <span class="yr" style="left:0%">2022</span>
      <span class="yr" style="left:25%">2023</span>
      <span class="yr" style="left:50%">2024</span>
      <span class="yr" style="left:75%">2025</span>
      <span class="yr" style="left:100%">2026</span>
      <span class="axis-line"></span>
    </div>
    <div class="axis-gutter"></div>

    <div class="lane">
      <div class="lane-rail">
        <p class="lane-n">Writing code</p>
        <p class="lane-s">IDEs and dev tools</p>
      </div>
      <div class="lane-track">
        <span class="seg-before" style="width:37%"></span>
        <span class="seg-after"  style="width:63%"></span>
        <span class="tick"   style="left:37%"></span>
        <span class="tick-l" style="left:37%">Cursor</span>
      </div>
      <div class="lane-gutter"></div>
    </div>

    <div class="lane">
      <div class="lane-rail">
        <p class="lane-n">Legal work</p>
        <p class="lane-s">research and drafting</p>
      </div>
      <div class="lane-track">
        <span class="seg-before" style="width:45%"></span>
        <span class="seg-after"  style="width:55%"></span>
        <span class="tick"   style="left:45%"></span>
        <span class="tick-l" style="left:45%">Harvey</span>
      </div>
      <div class="lane-gutter"></div>
    </div>

    <div class="lane">
      <div class="lane-rail">
        <p class="lane-n">Customer support</p>
        <p class="lane-s">service platforms</p>
      </div>
      <div class="lane-track">
        <span class="seg-before" style="width:62%"></span>
        <span class="seg-after"  style="width:38%"></span>
        <span class="tick"   style="left:62%"></span>
        <span class="tick-l" style="left:62%">Sierra</span>
      </div>
      <div class="lane-gutter"></div>
    </div>

    <div class="lane">
      <div class="lane-rail">
        <p class="lane-n">Your category</p>
        <p class="lane-s">still open</p>
      </div>
      <div class="lane-track">
        <span class="seg-open"></span>
        <span class="now"   style="left:100%"></span>
        <span class="now-l" style="left:100%">today</span>
        <svg class="spill" width="26" height="12" viewBox="0 0 26 12" fill="none" aria-hidden="true">
          <path d="M0 6h18M13 1.5 17.5 6 13 10.5" stroke="var(--sk-border-2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="lane-gutter"></div>
    </div>

  </div>

  <p class="fig-foot">The established platform in each case owned the customers, the data and the distribution. <b>What separated the company that won was building on the work itself rather than owning more of it.</b></p>
</figure>

<script defer src="/js/figure.js"></script>
</body>
</html>
