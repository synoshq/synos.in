<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>One call, and everything it has to pass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/synos.css">
<style>
/*
 * FIG. 03 · "One call, and everything it has to pass"
 *
 * Governance is the thing buyers say blocks them, and every vendor answers it with a diagram of a
 * shield. So answer it with a trace instead: one real call, every gate it passes, and the verdict
 * at each. A CISO reads a trace; nobody has ever been reassured by a shield.
 *
 * The call is denied at the policy gate BY PRIYA'S RULE FROM FIG 01. The figures are meant to be
 * read as one system: a person's correction in figure one is what stops a wrong action in figure
 * three. That connection is the product, so the diagrams should carry it.
 *
 * Form: a vertical trace log. FIG 01 fans outward, FIG 02 compares two bands, this one descends.
 */

body { padding: 88px 24px; }
.fig { max-width: 1080px; margin: 0 auto; }
.fig p { max-width: none; }

.fig-head { margin-bottom: var(--sk-space-7); }
.fig-num { display: block; font-family: var(--sk-font-mono); font-size: 11px;
  letter-spacing: 0.18em; color: var(--sk-dim); margin-bottom: var(--sk-space-4); }
.fig-title { font-family: var(--sk-font-body); font-size: clamp(22px, 2.4vw, 28px);
  font-weight: 600; letter-spacing: -0.02em; color: var(--sk-ink); }
.fig-lede { margin-top: var(--sk-space-4); font-size: 15px; line-height: 1.65;
  color: var(--sk-ink-3); max-width: 62ch !important; }

/* ── the request ────────────────────────────────────────────────────────── */
.req {
  background: var(--sk-surface); border: 1px solid var(--sk-border-2); border-radius: 3px;
  padding: var(--sk-space-5) var(--sk-space-6); margin-bottom: var(--sk-space-6);
  font-family: var(--sk-font-mono); font-size: 12.5px; line-height: 1.9; color: var(--sk-ink-2);
}
.req-h { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--sk-dim); margin-bottom: var(--sk-space-3); }
.req .k { color: var(--sk-dim); display: inline-block; width: 8ch; }

/* ── the trace ──────────────────────────────────────────────────────────── */
.trace { border-top: 1px solid var(--sk-ink); }
.step {
  display: grid;
  grid-template-columns: 46px 168px minmax(0, 1fr) 132px;
  gap: var(--sk-space-5);
  align-items: baseline;
  padding: var(--sk-space-5) 0;
  border-bottom: 1px solid var(--sk-border);
  position: relative;
}
/* The spine. A continuous rule through the gutter, so the steps read as one call descending rather
 * than as five unrelated rows. */
.step::before {
  content: ''; position: absolute; left: 16px; top: 0; bottom: 0; width: 1px;
  background: var(--sk-border-2);
}
.step:first-child::before { top: 50%; }
.step:last-child::before  { bottom: 50%; }
.step .n {
  position: relative; z-index: 1; justify-self: start;
  font-family: var(--sk-font-mono); font-size: 10.5px; color: var(--sk-dim);
  background: var(--sk-bg); padding: 2px 0; width: 33px; text-align: center;
}
.step .gate { font-family: var(--sk-font-body); font-size: 14.5px; font-weight: 600; color: var(--sk-ink); }
.step .what { font-family: var(--sk-font-mono); font-size: 12px; line-height: 1.75; color: var(--sk-ink-3); }
.step .what b { color: var(--sk-ink); font-weight: 500; }
.step .what .ref { color: var(--sk-indigo); }

.v { justify-self: end; display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--sk-font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; }
.v i { width: 5px; height: 5px; border-radius: 999px; }
.v-pass { color: var(--sk-emerald-ink); }  .v-pass i { background: var(--sk-emerald); }
.v-hold { color: var(--sk-amber-ink); }    .v-hold i { background: var(--sk-amber-2); }
.v-deny { color: var(--sk-red-ink); }      .v-deny i { background: var(--sk-red-2); }
.v-note { color: var(--sk-muted); }        .v-note i { background: var(--sk-border-2); }

/* The step where the company's own rule does the work. */
.step.is-key { background: var(--sk-indigo-bg); margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
.step.is-key::before { left: 32px; }
.step.is-key .n { background: var(--sk-indigo-bg); }

.callout {
  margin-top: var(--sk-space-6); padding: var(--sk-space-5) var(--sk-space-6);
  border-left: 2px solid var(--sk-indigo-2); background: var(--sk-surface);
  font-size: 14px; line-height: 1.7; color: var(--sk-ink-2);
}
.callout b { color: var(--sk-ink); font-weight: 600; }

.fig-foot { margin-top: var(--sk-space-7); padding-top: var(--sk-space-6);
  border-top: 1px solid var(--sk-border); display: flex; align-items: baseline;
  justify-content: space-between; gap: var(--sk-space-7); flex-wrap: wrap;
  font-size: 14px; color: var(--sk-ink-3); }
.fig-foot b { color: var(--sk-ink); font-weight: 600; }
.fig-note { margin-top: var(--sk-space-5); font-family: var(--sk-font-mono); font-size: 10.5px;
  letter-spacing: 0.04em; color: var(--sk-dim); }

@media (max-width: 820px) {
  .step { grid-template-columns: 34px minmax(0,1fr); row-gap: var(--sk-space-3); }
  .step .what, .v { grid-column: 2; }
  .v { justify-self: start; }
  .step::before, .step.is-key::before { left: 10px; }
}
</style>
</head>
<body>

<figure class="fig">
  <figcaption class="fig-head">
    <span class="fig-num">FIG. 03</span>
    <span class="fig-title">One call, and everything it has to pass</span>
    <p class="fig-lede">Governance is where AI programmes actually stop, and it is usually answered with a picture of a shield. Here is the trace instead: one agent asking to touch a real system, and every gate between it and the record.</p>
  </figcaption>

  <div class="req">
    <p class="req-h">the request</p>
    <div><span class="k">agent</span>renewal-outreach</div>
    <div><span class="k">wants</span>crm.accounts.update &middot; notify(sms)</div>
    <div><span class="k">on</span>ACC-8841 &middot; tier T1 &middot; 4 days past due</div>
  </div>

  <div class="trace">
    <div class="step">
      <span class="n">01</span>
      <span class="gate">Identity</span>
      <span class="what">Acts as <b>priya@</b>, delegated, not a shared key.<br>Token expires in <b>9 minutes</b>. Revocable now.</span>
      <span class="v v-pass"><i></i>pass</span>
    </div>

    <div class="step">
      <span class="n">02</span>
      <span class="gate">Scope</span>
      <span class="what">Tool <b>crm.update</b> may write <b>status</b>, <b>next_action</b>.<br>Requested <b>status</b>. Everything else on the record is out of reach.</span>
      <span class="v v-pass"><i></i>pass</span>
    </div>

    <div class="step is-key">
      <span class="n">03</span>
      <span class="gate">Policy</span>
      <span class="what"><b>notify(sms)</b> refused on tier T1.<br>The rule came from <span class="ref">Priya, run #4182</span>, and every agent inherits it.</span>
      <span class="v v-deny"><i></i>denied</span>
    </div>

    <div class="step">
      <span class="n">04</span>
      <span class="gate">Approval</span>
      <span class="what">Rewritten to <b>email finance</b>, which the policy allows above a threshold.<br>Sent to the process owner for sign-off.</span>
      <span class="v v-hold"><i></i>held</span>
    </div>

    <div class="step">
      <span class="n">05</span>
      <span class="gate">Execution</span>
      <span class="what">Runs in a sandbox cut from the real system, then against it.<br>No egress path beyond the declared hosts. Kill switch live throughout.</span>
      <span class="v v-pass"><i></i>pass</span>
    </div>

    <div class="step">
      <span class="n">06</span>
      <span class="gate">Audit</span>
      <span class="what">Who, what, when, which scope, which policy, which approver.<br>Written before the response returns.</span>
      <span class="v v-note"><i></i>recorded</span>
    </div>
  </div>

  <p class="callout">Step 03 is the whole argument. <b>The gate that stopped this call was written by one of your own people, doing their job</b>, and it now applies to every agent, on every model, for as long as you run the layer.</p>

  <p class="fig-foot">
    <span>Engineering declares the rails once. Nothing above them can reach past what was declared.</span>
    <span><b>Six gates, one call, fully traced.</b></span>
  </p>
  <p class="fig-note">Illustrative. The workflow, the rule and the person are invented to show the shape of the thing, not drawn from a customer.</p>
</figure>

</body>
</html>
