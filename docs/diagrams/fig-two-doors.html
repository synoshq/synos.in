<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Two ways in, one platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/synos.css">
<style>
/*
 * FIG. 11 · "Two ways in, one platform"
 *
 * Replaces two prose cards sitting side by side. Cards say "here are two things"; the argument is
 * the opposite, that two different starting problems resolve into one identical install.
 *
 * Form: a convergence. Two distinct columns meet at a seam and resolve into one band spanning both.
 * No literal doors and no funnel: a drawn funnel is a sales diagram and this has to survive a
 * technical reader.
 *
 * Rewritten 2026-08-22 after Anoop read it as written for an investor rather than a customer. The
 * first version used the deck's own vocabulary: who signs, where the deal enters, how the account
 * expands, "a door is a sales entry point". All of that describes our motion, not their value. The
 * rows now say what the customer wants, what is blocking them, who does the building, and what they
 * get first. If a row cannot be read aloud to a buyer, it does not belong in this figure.
 */

body { padding: 88px 24px; }
.fig { max-width: 1080px; margin: 0 auto; }
.fig p { max-width: none; }

.fig-head { margin-bottom: var(--sk-space-8); }
.fig-num { display: block; font-family: var(--sk-font-mono); font-size: 11px;
  letter-spacing: 0.18em; color: var(--sk-ink-3); margin-bottom: var(--sk-space-4); }
.fig-title { font-family: var(--sk-font-body); font-size: clamp(22px, 2.4vw, 28px);
  font-weight: 600; letter-spacing: -0.02em; color: var(--sk-ink); }
.fig-lede { margin-top: var(--sk-space-4); font-size: 15px; line-height: 1.65;
  color: var(--sk-ink-3); max-width: 62ch !important; }

.wrap { border: 1px solid var(--sk-border-2); border-radius: var(--sk-radius-sm);
  overflow: hidden; background: var(--sk-surface); }

/* ── the two doors ──────────────────────────────────────────────────────── */
.doors { display: grid; grid-template-columns: 1fr 1fr; }
.door { padding: var(--sk-space-6); }
.door + .door { border-left: 1px solid var(--sk-border); }

.d-tag { font-family: var(--sk-font-mono); font-size: 10.5px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--sk-indigo); margin-bottom: var(--sk-space-4); }
.d-title { font-size: 17px; font-weight: 600; letter-spacing: -0.015em; color: var(--sk-ink);
  margin-bottom: var(--sk-space-4); }
.d-rows { display: grid; gap: 0; }
.d-row { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: var(--sk-space-4);
  padding: var(--sk-space-3) 0; border-bottom: 1px solid var(--sk-border); }
.d-row:last-child { border-bottom: none; }
.d-k { font-family: var(--sk-font-mono); font-size: 10.5px; letter-spacing: 0.06em;
  color: var(--sk-ink-3); }
.d-v { font-size: 13.5px; line-height: 1.55; color: var(--sk-ink-2); }

/* ── the seam ───────────────────────────────────────────────────────────── */
/* Where the two columns stop being two. A single centred label on a rule that spans the full
 * width: the visual moment the argument turns. */
/* Height zero: the label sits ON the rule rather than in a band below it, so the two columns
 * meet the shared block with nothing dead in between. */
.seam { border-top: 1px solid var(--sk-ink); height: 0; text-align: center; }
.seam p { display: inline-block; font-family: var(--sk-font-mono); font-size: 10.5px;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--sk-ink-3);
  background: var(--sk-surface); padding: 0 var(--sk-space-5);
  transform: translateY(-50%); }

/* ── the shared install ─────────────────────────────────────────────────── */
.same { background: var(--sk-indigo-bg); padding: var(--sk-space-6);
  border-top: 1px solid var(--sk-indigo-br); }
.same-h { font-family: var(--sk-font-mono); font-size: 10.5px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--sk-indigo-ink); margin-bottom: var(--sk-space-5); }
.same-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sk-space-5); }
.same-i b { display: block; font-size: 13.5px; font-weight: 600; color: var(--sk-ink);
  margin-bottom: var(--sk-space-2); }
.same-i span { display: block; font-size: 12.5px; line-height: 1.55; color: var(--sk-ink-3); }

@media (max-width: 780px) {
  .doors { grid-template-columns: 1fr; }
  .door + .door { border-left: none; border-top: 1px solid var(--sk-border); }
  .same-grid { grid-template-columns: 1fr; gap: var(--sk-space-4); }
}

.fig-foot { margin-top: var(--sk-space-7); display: flex; justify-content: space-between;
  gap: var(--sk-space-6); flex-wrap: wrap;
  font-size: 13px; line-height: 1.6; color: var(--sk-ink-3); }
.fig-foot b { color: var(--sk-ink); font-weight: 600; }
</style>
<script defer src="/js/figure.js"></script>
</head>
<body>

<figure class="fig" aria-label="Two ways to start, at your operations or through your product, both arriving at the same installation">
  <div class="fig-head">
    <span class="fig-num">FIG. 11</span>
    <h2 class="fig-title">Two ways in, one platform</h2>
    <p class="fig-lede">Most companies arrive with one of these two problems. Whichever one you start from, what gets installed is the same, so the second one costs you a project rather than a purchase.</p>
  </div>

  <div class="wrap">
    <div class="doors">
      <div class="door">
        <p class="d-tag">Start inward</p>
        <p class="d-title">At your operations</p>
        <div class="d-rows">
          <div class="d-row"><p class="d-k">you want</p><p class="d-v">Agents doing the expensive work your team repeats every week</p></div>
          <div class="d-row"><p class="d-k">blocked by</p><p class="d-v">Every change needs an engineer, and the queue is months long</p></div>
          <div class="d-row"><p class="d-k">who builds</p><p class="d-v">Your ops, finance and support experts, in plain English</p></div>
          <div class="d-row"><p class="d-k">first result</p><p class="d-v">One workflow running in weeks, on systems you did not have to move</p></div>
        </div>
      </div>

      <div class="door">
        <p class="d-tag">Start outward</p>
        <p class="d-title">Through your product</p>
        <div class="d-rows">
          <div class="d-row"><p class="d-k">you want</p><p class="d-v">The AI features your customers keep asking you for</p></div>
          <div class="d-row"><p class="d-k">blocked by</p><p class="d-v">Isolation, audit and deployment questions every enterprise customer asks</p></div>
          <div class="d-row"><p class="d-k">who builds</p><p class="d-v">Your product team, with a separate brain per customer</p></div>
          <div class="d-row"><p class="d-k">first result</p><p class="d-v">A shipped feature, and the second one in days rather than months</p></div>
        </div>
      </div>
    </div>

    <div class="seam"><p>both arrive here</p></div>

    <div class="same">
      <p class="same-h">what you end up owning</p>
      <div class="same-grid">
        <div class="same-i">
          <b>It runs where you run</b>
          <span>Inside your own environment. Your cloud, your Kubernetes, or air-gapped with no outbound path.</span>
        </div>
        <div class="same-i">
          <b>Your risk review has one thing to check</b>
          <span>One gate for every caller, and one audit trail, whichever way you came in.</span>
        </div>
        <div class="same-i">
          <b>What it learns stays yours</b>
          <span>Corrections, traces and evaluation cases accumulate on your infrastructure, not in a vendor's product.</span>
        </div>
      </div>
    </div>
  </div>

  <p class="fig-foot">
    <span>Start with whichever hurts more. Adding the other later needs no second install.</span>
    <span><b>You are buying the platform, not one of the two workflows.</b></span>
  </p>
</figure>

</body>
</html>
