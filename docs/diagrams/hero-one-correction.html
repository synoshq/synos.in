<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Candidate B · one correction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/synos.css">
<style>
/*
 * Candidate B · "one correction, four lives"
 *
 * The argument in one figure: a company's own AI is built out of what its people know, and the
 * only place that knowledge surfaces is in the work. So show the substance rather than a metaphor
 * for it. One real correction, and the four things it becomes.
 *
 * Register is deliberately editorial and technical: hairlines, small caps, a mono content voice,
 * colour used only where it carries meaning. No gradients, no glass, no floating slabs. Those read
 * as machine-made because they are what every machine makes.
 */

body { padding: 72px 24px; }
.fig { max-width: 1080px; margin: 0 auto; }
/* The global measure is for running prose. Inside a figure it makes meta lines wrap and columns
 * disagree about their own width, so it is reset here rather than fought line by line. */
.fig p { max-width: none; }

.fig-head { display: flex; align-items: baseline; gap: var(--sk-space-5); flex-wrap: wrap; margin-bottom: var(--sk-space-7); }
.fig-num  { font-family: var(--sk-font-mono); font-size: 11px; letter-spacing: 0.14em; color: var(--sk-dim); }
.fig-title { font-family: var(--sk-font-body); font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }

/* ── the moment ─────────────────────────────────────────────────────────── */
.moment {
  border: 1px solid var(--sk-border-2);
  border-left: 3px solid var(--sk-indigo-2);
  border-radius: 2px;                       /* almost square: a document, not a card */
  background: var(--sk-surface);
  padding: var(--sk-space-6) var(--sk-space-7);
}
.moment-meta {
  display: flex; gap: var(--sk-space-6); align-items: baseline; flex-wrap: wrap;
  font-family: var(--sk-font-mono); font-size: 11px; letter-spacing: 0.04em;
  color: var(--sk-dim); margin-bottom: var(--sk-space-5);
}
.moment-meta b { color: var(--sk-ink-3); font-weight: 500; }
.line { font-family: var(--sk-font-mono); font-size: 13.5px; line-height: 2; color: var(--sk-ink-2); }
.line + .line { margin-top: var(--sk-space-2); }
.gut { display: inline-block; width: 1.4em; color: var(--sk-dim); user-select: none; }
.cut { color: var(--sk-muted); text-decoration: line-through; text-decoration-color: var(--sk-red-2); }
.add { color: var(--sk-ink); background: var(--sk-emerald-bg); box-shadow: 0 0 0 2px var(--sk-emerald-bg); }
.who {
  margin-top: var(--sk-space-5); font-family: var(--sk-font-body); font-size: 13px; color: var(--sk-ink-3);
}
.who b { color: var(--sk-ink); font-weight: 600; }

/* ── the spine ──────────────────────────────────────────────────────────── */
.spine { position: relative; height: 56px; }
.spine::before {
  content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px;
  background: var(--sk-border-2);
}
.spine span {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  background: var(--sk-bg); padding: 0 var(--sk-space-4);
  font-family: var(--sk-font-mono); font-size: 10.5px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--sk-ink-3); white-space: nowrap;
}

/* ── the four lives ─────────────────────────────────────────────────────── */
.lives {
  display: grid; grid-template-columns: repeat(4, 1fr);
  grid-template-rows: auto auto auto auto auto;
  border-top: 1px solid var(--sk-ink);
}
/* Subgrid so the number, title, description, artefact and status of all four columns sit on the
 * same five lines. Without it each column sets its own rhythm and the chips land at four different
 * heights, which is what a reader notices first. */
.life {
  grid-row: span 5; display: grid; grid-template-rows: subgrid; row-gap: 0;
  padding: var(--sk-space-6) var(--sk-space-5) var(--sk-space-6) 0;
}
.life + .life { border-left: 1px solid var(--sk-border); padding-left: var(--sk-space-5); }

.life-n {
  font-family: var(--sk-font-mono); font-size: 11px; letter-spacing: 0.1em;
  color: var(--sk-indigo-2); margin-bottom: var(--sk-space-4);
}
.life-t { font-family: var(--sk-font-body); font-size: 15px; font-weight: 600; margin-bottom: var(--sk-space-2); }
.life-d { font-size: 13px; line-height: 1.6; color: var(--sk-ink-3); margin-bottom: var(--sk-space-5); align-self: start; }

.art {
  align-self: start;
  font-family: var(--sk-font-mono); font-size: 11.5px; line-height: 1.75;
  color: var(--sk-ink-2); background: var(--sk-surface);
  border: 1px solid var(--sk-border); border-radius: 2px;
  padding: var(--sk-space-4); margin-bottom: var(--sk-space-5);
  min-height: 96px;
}
.art .k { color: var(--sk-dim); }
.art .v { color: var(--sk-ink); }
.art .ok { color: var(--sk-emerald-ink); }

.stat {
  align-self: end; justify-self: start;
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--sk-font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
}
.dot { width: 6px; height: 6px; border-radius: 999px; display: inline-block; }
.s-live  { color: var(--sk-emerald-ink); } .s-live  .dot { background: var(--sk-emerald); }
.s-build { color: var(--sk-amber-ink); }   .s-build .dot { background: var(--sk-amber-2); }
.s-next  { color: var(--sk-ink-3); }       .s-next  .dot { background: var(--sk-border-2); }

.fig-foot {
  margin-top: var(--sk-space-7); padding-top: var(--sk-space-5);
  border-top: 1px solid var(--sk-border);
  display: flex; align-items: baseline; justify-content: space-between;
  gap: var(--sk-space-7); flex-wrap: wrap;
  font-size: 13px; color: var(--sk-ink-3);
}
.fig-foot > span:last-child { text-align: right; white-space: nowrap; }
.fig-foot b { color: var(--sk-ink); font-weight: 600; }

@media (max-width: 900px) {
  .lives { grid-template-columns: repeat(2, 1fr); }
  .life:nth-child(3) { border-left: none; padding-left: 0; }
  .life:nth-child(3), .life:nth-child(4) { border-top: 1px solid var(--sk-border); }
}
@media (max-width: 560px) {
  .lives { grid-template-columns: 1fr; }
  .life + .life { border-left: none; padding-left: 0; border-top: 1px solid var(--sk-border); }
}
</style>
</head>
<body>

<figure class="fig">
  <figcaption class="fig-head">
    <span class="fig-num">FIG. 01</span>
    <span class="fig-title">What one correction becomes</span>
  </figcaption>

  <!-- the moment it happens -->
  <div class="moment">
    <p class="moment-meta">
      <span>agent <b>renewal-outreach</b></span>
      <span>run <b>#4,182</b></span>
      <span>reviewed by <b>Priya, Collections</b></span>
    </p>
    <p class="line"><span class="gut">−</span><span class="cut">Escalate to SMS after 3 days past due.</span></p>
    <p class="line"><span class="gut">+</span><span class="add">Tier-1 accounts never go by SMS. Email finance first, then their account manager.</span></p>
    <p class="who">Priya has run collections for <b>nine years</b>. This rule was written down nowhere.</p>
  </div>

  <div class="spine"><span>captured in the flow of work</span></div>

  <!-- what it becomes -->
  <div class="lives">
    <div class="life">
      <p class="life-n">01</p>
      <p class="life-t">A rule</p>
      <p class="life-d">Reviewed once, then every agent inherits it. Versioned and revertible.</p>
      <div class="art">
        <span class="k">policy</span> <span class="v">tier1.channel</span><br>
        <span class="k">deny</span>   <span class="v">sms</span><br>
        <span class="k">order</span>  <span class="v">finance → am</span><br>
        <span class="k">since</span>  <span class="v">run #4182</span>
      </div>
      <span class="stat s-live"><i class="dot"></i>live</span>
    </div>

    <div class="life">
      <p class="life-n">02</p>
      <p class="life-t">Context</p>
      <p class="life-d">It enters the Company Brain, cited to the run and the person it came from.</p>
      <div class="art">
        <span class="k">entity</span> <span class="v">Account.tier</span><br>
        <span class="k">bound</span>  <span class="v">crm.accounts.tier</span><br>
        <span class="k">cite</span>   <span class="v">run #4182</span><br>
        <span class="k">by</span>     <span class="v">priya@</span>
      </div>
      <span class="stat s-live"><i class="dot"></i>live</span>
    </div>

    <div class="life">
      <p class="life-n">03</p>
      <p class="life-t">An eval case</p>
      <p class="life-d">Replayed on every change. A model that gets this wrong does not get promoted.</p>
      <div class="art">
        <span class="k">case</span>   <span class="v">tier1-no-sms</span><br>
        <span class="k">input</span>  <span class="v">acct 8841, 4d late</span><br>
        <span class="k">expect</span> <span class="v">email finance</span><br>
        <span class="k">result</span> <span class="ok">pass</span>
      </div>
      <span class="stat s-build"><i class="dot"></i>in build</span>
    </div>

    <div class="life">
      <p class="life-n">04</p>
      <p class="life-t">A training example</p>
      <p class="life-d">Labelled by the person who owns the process, on your own infrastructure.</p>
      <div class="art">
        <span class="k">prompt</span> <span class="v">acct 8841, 4d late</span><br>
        <span class="k">chosen</span> <span class="v">email finance</span><br>
        <span class="k">reject</span> <span class="v">sms</span><br>
        <span class="k">weight</span> <span class="v">1.0</span>
      </div>
      <span class="stat s-next"><i class="dot"></i>roadmap</span>
    </div>
  </div>

  <p class="fig-foot">
    <span>Nine years of judgement, captured once, in ninety seconds of someone's actual work.</span>
    <span><b>None of it left the building.</b></span>
  </p>
</figure>

</body>
</html>
